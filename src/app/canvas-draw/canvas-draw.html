<div #threeContainer class="three-container"></div>
<div #uiContainer class="ui-container"></div>

<!-- Overlay de entrada — se remueve del DOM tras la transición de fade -->
@if (showOverlay) {
  <app-intro-overlay
    (startExperience)="onStartExperience()"
    (fadeComplete)="onFadeComplete()">
  </app-intro-overlay>
}

<!-- Indicadores persistentes — visibles siempre, sobre el canvas -->
<app-connection-indicator [connectionText]="connectionText()"></app-connection-indicator>
<app-viewer-counter [count]="viewerCount()"></app-viewer-counter>
